<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branches — Wafiq Superstores</title>
    <meta name="description" content="Wafiq Superstores branch locations, opening hours, phone numbers and directions." />
    <meta name="theme-color" content="#136f37" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wafiq:theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('wafiq:lang') === 'ur' ? 'ur' : 'en';
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>

  <body data-page="branches">
    <main id="main">
      <section class="section shell" style="padding-block-start: clamp(7rem, 12vw, 9rem); padding-block-end: 0">
        <p class="eyebrow" data-i18n="branches.eyebrow">Come and see</p>
        <h1 style="font-size: clamp(2.2rem, 6vw, 4rem); margin: 0 0 1rem" data-i18n="branches.title">
          Our branches
        </h1>
        <p class="lede" data-i18n="branches.sub"></p>
      </section>

      <section class="section shell" style="padding-block-start: 1.75rem">
        <div data-branch-list></div>
      </section>

      <!-- ========================== REVIEWS ========================== -->
      <section class="section section--framed" aria-labelledby="reviews-title">
        <div class="section__frame">
          <header class="section__head">
            <div>
              <p class="eyebrow" data-i18n="reviews.eyebrow">What shoppers say</p>
              <h2 id="reviews-title" data-i18n="reviews.title">Reviews from Google</h2>
            </div>
            <p class="lede" data-i18n="reviews.sub"></p>
          </header>
          <div class="reviews" data-reviews></div>
        </div>
      </section>

    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
