<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — Wafiq Superstores</title>
    <meta name="description" content="Search every product, brand and aisle stocked at Wafiq Superstores." />
    <meta name="theme-color" content="#136f37" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wafiq:theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('wafiq:lang') === 'ur' ? 'ur' : 'en';
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>

  <body data-page="search">
    <main id="main" data-search-page>
      <section class="section shell" style="padding-block-start: clamp(7rem, 12vw, 9rem); padding-block-end: 0">
        <p class="eyebrow" data-i18n="search.open">Search</p>
        <h1 style="font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 1rem" data-i18n="search.title">
          Search the shop
        </h1>
        <p class="lede" data-i18n="search.sub"></p>

        <label class="field" style="max-width: 34rem; margin-block-start: 1.75rem">
          <span class="sr-only field__label" data-i18n="search.title">Search the shop</span>
          <input
            type="search"
            data-search-input
            autocomplete="off"
            spellcheck="false"
            data-i18n-attr="placeholder:search.placeholder"
            placeholder="Search products, brands or aisles…"
          />
        </label>
      </section>

      <section class="section shell" style="padding-block-start: 1.5rem">
        <div class="results-summary" data-search-summary></div>
        <div class="shelf-tabs" data-search-aisles></div>
        <div data-search-results></div>
      </section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
