<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All aisles — Wafiq Superstores</title>
    <meta
      name="description"
      content="Every aisle at Wafiq Superstores: snacks, tea and breakfast, milk and beverages, cooking essentials, condiments, home and kitchen, cleaning, baby care and personal care."
    />
    <meta name="theme-color" content="#136f37" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wafiq:theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('wafiq:lang') === 'ur' ? 'ur' : 'en';
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>

  <body data-page="categories">
    <main id="main">
      <section class="section shell" style="padding-block-start: clamp(7rem, 12vw, 9rem)">
        <p class="eyebrow" data-i18n="categories.eyebrow">The full shop</p>
        <h1 style="font-size: clamp(2.2rem, 6vw, 4.5rem); margin: 0 0 1rem" data-i18n="categories.title">
          Every aisle we stock
        </h1>
        <p class="lede" data-i18n="categories.sub"></p>
      </section>

      <section class="section shell" style="padding-block-start: 0" aria-label="Aisles">
        <div data-category-grid></div>
      </section>

      <section class="section shell" style="padding-block-start: 0" aria-labelledby="shelf-index-title">
        <header class="section__head">
          <div>
            <p class="eyebrow" data-i18n="category.shelves">Shelves</p>
            <h2 id="shelf-index-title" data-i18n="categories.shelvesIn">Shelves in this aisle</h2>
          </div>
        </header>
        <div class="shelf-index" data-shelf-index></div>
      </section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
