<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About — Wafiq Superstores</title>
    <meta
      name="description"
      content="Wafiq Superstores brings groceries, household goods, cleaning, baby care and personal care together under one roof."
    />
    <meta name="theme-color" content="#136f37" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wafiq:theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('wafiq:lang') === 'ur' ? 'ur' : 'en';
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>

  <body data-page="about">
    <main id="main">
      <section class="section shell" style="padding-block-start: clamp(7rem, 12vw, 9rem); padding-block-end: 0">
        <p class="eyebrow" data-i18n="about.eyebrow">Who we are</p>
        <h1 style="font-size: clamp(2.2rem, 6vw, 4.2rem); margin: 0 0 1.25rem" data-i18n="about.title">
          One roof, one list, one trip
        </h1>
        <p class="lede" data-i18n="about.lead"></p>
      </section>

      <section class="section section--framed">
        <div class="section__frame">
          <div style="display: grid; gap: 1.25rem; max-width: 62ch">
            <p data-i18n="about.bodyOne" data-reveal data-reveal-index="0"></p>
            <p data-i18n="about.bodyTwo" data-reveal data-reveal-index="1"></p>
          </div>

          <div class="stat-grid">
            <div class="stat" data-reveal data-reveal-index="0">
              <strong data-count-key="aisles">0</strong><span data-i18n="stats.aisles">Aisles in store</span>
            </div>
            <div class="stat" data-reveal data-reveal-index="1">
              <strong data-count-key="shelves">0</strong><span data-i18n="stats.shelves">Shelves to browse</span>
            </div>
            <div class="stat" data-reveal data-reveal-index="2">
              <strong data-count-key="products">0</strong><span data-i18n="stats.products">Products listed</span>
            </div>
            <div class="stat" data-reveal data-reveal-index="3">
              <strong data-count-key="brands">0</strong><span data-i18n="stats.brands">Brands stocked</span>
            </div>
          </div>
        </div>
      </section>

      <section class="section section--framed" aria-labelledby="values-title">
        <header class="section__head" style="padding-inline: clamp(1rem, 3vw, 2rem)">
          <h2 id="values-title" data-i18n="about.valuesTitle">What we care about</h2>
        </header>
        <div class="promo-grid">
          <article class="promo" style="--promo-bg: #0e6337; --promo-fg: #fff" data-reveal data-reveal-index="0">
            <h3 data-i18n="about.valueOneTitle">Everything in one trip</h3>
            <p data-i18n="about.valueOneBody"></p>
          </article>
          <article class="promo" style="--promo-bg: #b2dd4a" data-reveal data-reveal-index="1">
            <h3 data-i18n="about.valueTwoTitle">Brands people trust</h3>
            <p data-i18n="about.valueTwoBody"></p>
          </article>
          <article class="promo" style="--promo-bg: #dceaf7" data-reveal data-reveal-index="2">
            <h3 data-i18n="about.valueThreeTitle">Know before you go</h3>
            <p data-i18n="about.valueThreeBody"></p>
          </article>
        </div>
      </section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
